<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a14;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#0e0e1e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0a14;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="50%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(245,158,11,0)"/>
      <stop offset="50%" style="stop-color:rgba(245,158,11,0.08)"/>
      <stop offset="100%" style="stop-color:rgba(245,158,11,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="400" fill="url(#glow)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(245,158,11,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Block icon -->
  <rect x="60" y="100" width="80" height="80" rx="8" stroke="url(#accentGrad)" stroke-width="3" fill="none"/>
  <rect x="75" y="115" width="50" height="50" rx="4" fill="#f59e0b" opacity="0.15"/>
  <rect x="80" y="120" width="14" height="14" rx="2" fill="#f59e0b" opacity="0.4"/>
  <rect x="98" y="120" width="14" height="14" rx="2" fill="#f59e0b" opacity="0.25"/>
  <rect x="80" y="138" width="14" height="14" rx="2" fill="#fbbf24" opacity="0.3"/>
  <rect x="98" y="138" width="14" height="14" rx="2" fill="#d97706" opacity="0.35"/>
  <line x1="60" y1="140" x2="140" y2="140" stroke="rgba(245,158,11,0.08)" stroke-width="1"/>

  <!-- Decorative blocks -->
  <rect x="1060" y="240" width="60" height="60" rx="6" stroke="url(#accentGrad)" stroke-width="2" fill="none" opacity="0.3"/>
  <rect x="1070" y="250" width="40" height="40" rx="3" fill="#f59e0b" opacity="0.08"/>

  <rect x="1000" y="120" width="40" height="40" rx="4" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.15"/>
  <rect x="1008" y="128" width="24" height="24" rx="2" fill="#d97706" opacity="0.06"/>

  <!-- Title -->
  <text x="160" y="155" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" fill="#f1f0ec" letter-spacing="-2">CraftForge</text>
  <text x="160" y="195" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500" fill="#a09ea8" letter-spacing="0">Web GUI for Minecraft Server Management</text>

  <!-- Feature badges -->
  <rect x="160" y="230" width="110" height="28" rx="14" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.15)" stroke-width="1"/>
  <text x="215" y="249" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">FastAPI Backend</text>

  <rect x="282" y="230" width="110" height="28" rx="14" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.15)" stroke-width="1"/>
  <text x="337" y="249" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">Live Console</text>

  <rect x="404" y="230" width="110" height="28" rx="14" fill="rgba(59,130,246,0.1)" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
  <text x="459" y="249" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">REST API</text>

  <rect x="526" y="230" width="110" height="28" rx="14" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.15)" stroke-width="1"/>
  <text x="581" y="249" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">WebSockets</text>

  <!-- Subtitle line -->
  <text x="160" y="300" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#5a5866" font-weight="400">
    <tspan x="160" dy="0">Create, configure, and host Minecraft servers from your browser.</tspan>
    <tspan x="160" dy="22">Built with Python, FastAPI, and vanilla JavaScript.</tspan>
  </text>
</svg>
